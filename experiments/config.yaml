# Hyperparameters from paper (Appendix Table A.2)

survival_vae:
  latent_dim: 10
  epochs: 50
  beta: 0.01
  gamma: 1.0
  batch_size: 64
  learning_rate: 0.001

missingness:
  scenarios:
    light: 0.30
    moderate: 0.50
    severe: 0.68
  mechanisms:
    - mcar
    - mar
    - mnar

evaluation:
  cv_folds: 5
  random_seed: 42
  metrics:
    - rmse
    - mae
    - c_index
    - ibs
    - td_auc
